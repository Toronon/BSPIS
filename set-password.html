<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set Admin Password - BSPIS</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="login-body" data-page="set-password">
    <main class="login-page"><div class="login-shell">
        <section class="login-visual" aria-label="Admin account setup">
            <div class="visual-brand"><img src="assets/logo/logo.png" alt="BSPI logo"><span>BSPIS</span></div>
            <div class="visual-copy"><p class="visual-kicker">Admin account setup</p><h1>Secure your administrator account.</h1><p>Set a private password to access the barangay administration workspace.</p></div>
            <div class="visual-line" aria-hidden="true"></div><p class="visual-caption">Secure account setup</p>
        </section>
        <section class="login-container">
            <a href="index.html" class="back-home">&larr; Back to home</a>
            <div class="login-heading"><p class="login-kicker">Invitation accepted</p><h2>Set your password</h2><p>Create a password to finish setting up your admin account.</p></div>
            <p id="password-message" class="login-error" role="alert" hidden></p>
            <form id="set-password-form" method="post" action="set-password.html" onsubmit="return window.BSPIS_PASSWORD_READY === true" hidden>
                <div class="login-field"><label for="new-password">New password</label><input id="new-password" type="password" name="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></div>
                <div class="login-field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" name="confirm_password" autocomplete="new-password" minlength="8" placeholder="Enter the password again" required></div>
                <button type="submit">Save password <span aria-hidden="true">&rarr;</span></button>
            </form>
        </section>
    </div></main>
    <script src="scripts/config.js"></script><script type="module" src="scripts/site.js"></script>
</body>
</html>
