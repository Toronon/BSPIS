<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - BSPIS</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/admin.css">
</head>
<body data-page="admin">
    <header class="site-header"><div class="header-container">
        <a class="logo" href="admin.html"><img src="assets/logo/logo.png" alt=""><span>BSPIS</span></a>
        <button class="menu-toggle" type="button" aria-label="Toggle navigation">☰</button>
        <nav class="nav">
            <a href="index.html">Public site</a><a href="admin-officials.html">Officials</a>
            <a href="admin-residents.html">Residents</a><a href="admin-funds.html">Funds</a>
            <a href="admin-announcements.html">Announcements</a>
            <button class="btn" id="logout-button" type="button">Logout</button>
        </nav>
    </div></header>
    <main class="main-content admin-dashboard-page">
        <section class="admin-dashboard-header"><div><p class="section-kicker">Admin workspace</p><h1>Dashboard</h1><p>Overview of the barangay system and current leadership directory.</p></div></section>
        <p id="admin-message" role="status"></p>
        <div class="dashboard-grid">
            <div class="dash-card"><span class="label">Residents</span><strong id="resident-count">—</strong></div>
            <div class="dash-card"><span class="label">Funds</span><strong id="fund-count">—</strong></div>
            <div class="dash-card"><span class="label">Announcements</span><strong id="announcement-count">—</strong></div>
        </div>
        <section class="dashboard-leadership">
            <div class="dashboard-leadership-header"><h2>Leadership Directory</h2><span id="official-count">Loading officials…</span></div>
            <div id="admin-leadership"></div>
        </section>
    </main>
    <footer class="site-footer"><p>&copy; <span data-year></span> BSPI. All rights reserved.</p></footer>
    <script src="scripts/config.js"></script><script type="module" src="scripts/site.js"></script>
</body>
</html>
